# Render Blueprint for TYLO One API (huedora-projects-server)
# Uses Docker so LibreOffice can convert Document Template DOCX → PDF with Word fidelity.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: huedora-projects-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEMORY_LOG
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: HEAVY_JOB_CONCURRENCY
        value: "1"
      - key: HEAVY_JOB_MAX_QUEUE
        value: "20"
      - key: CLIENT_ORIGIN
        value: https://huedora-projects.onrender.com
      - key: USE_MONGOOSE
        value: "true"
      - key: USE_MEMORY_DB
        value: "false"
      - key: RESET_ALL_DATA_ON_BOOT
        value: "false"
      - key: RESEED_GEO_ON_BOOT
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Cloudflare R2 (tylo-one-files) — set secrets in Render dashboard
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: tylo-one-files
      - key: R2_REQUIRED
        sync: false

  # Optional paid worker — enable when upgrading off free plan to isolate IMAP/media.
  # Disabled by default so free-tier blueprint still deploys a single web service.
